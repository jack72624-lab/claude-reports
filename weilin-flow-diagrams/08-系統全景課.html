<!doctype html>
<!--
  這頁是什麼：給第一次用系統的同事看的「系統全景課」（2026-11-23 加，總覽最後一個分頁）。
  用一個假的案子「林宅」從客戶走到收工，11 步。名字、數字全是編的，沒有截圖。
  ★ 改字、改步驟：只改第一個 <script> 的 LESSON。內容照 架構/操作地圖.md，職位寫法照它。
  ★ 動畫引擎（第二個 <script>）跟另一份 demo 共用，改引擎的規矩寫在 系統教學/系統全景課/CLAUDE.md。
  ★ 讀這頁的是公司同仁：頁面上的字一律白話，不寫程式名詞。
  這頁會推上公開站：原始碼看得到這段註解，所以不寫密碼、網址鑰匙、人名。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系統全景課・威琳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   互動課引擎（2026-11-23）
   版面：上排數字卡 → 等角方塊圖（圓點在方塊之間流動）→ 步驟條 → 這一步的說明 → 底部上一步／下一步
   內容全部在下面 <script> 的 LESSON 物件，引擎不寫死任何一堂課的字。
   換一堂課：改 LESSON；換外觀：改這段 :root 的色票與字體，加上 LESSON.palette 的方塊顏色。
   ============================================================ */
:root{
  --bg:#efe9dc;        /* 頁底：暖紙色 */
  --card:#faf7f0;      /* 卡片 */
  --stage:#f6f1e6;     /* 畫布底 */
  --ink:#24221e;       /* 主墨色：外框、正文 */
  --mut:#6d675b;       /* 次要字 */
  --line:#d8d0bf;      /* 卡片邊線 */
  --grid:#e4dccb;      /* 等角格線 */
  --acc:#c9e3a0;       /* 下一步按鈕、目前那一步 */
  --acc-ink:#24331a;
  --good:#3d8a3a;
  --bad:#c0412c;
  --warn:#b4720c;
  --chip:#fffdf8;
  --font:"Noto Serif TC","Songti TC",serif;
  --mono:"IBM Plex Mono",ui-monospace,"Noto Serif TC","Songti TC",monospace;
  --radius:14px;
  --ring:var(--good);   /* 「現在看這裡」擴散圈 */
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 120px}

/* 頂列 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:.02em}
.brand mark{background:linear-gradient(transparent 58%,var(--acc) 58%);color:inherit;padding:0 2px}
.top .sp{flex:1}
.top .by{font-family:var(--mono);font-size:12px;color:var(--mut)}

/* 課程標題 */
.head{padding:34px 0 18px}
.crumb{font-family:var(--mono);font-size:13px;color:var(--mut);letter-spacing:.02em}
.title-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:8px}
h1{font-size:44px;line-height:1.1;margin:0;font-weight:700;letter-spacing:.01em}
.chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12.5px;border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;background:var(--chip);display:inline-flex;align-items:center;gap:6px}
.chip.c1{background:#f6e7b8}.chip.c2{background:#d6ebc4}.chip.c3{background:#e2dcf3}
.sub{color:var(--mut);margin:10px 0 0;font-size:16px}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius)}

/* 畫布卡 */
.stage{margin-top:14px;overflow:hidden}
.tiles{display:flex;gap:10px;padding:14px 14px 0;flex-wrap:wrap}
.tile{position:relative;background:var(--chip);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px 8px 16px;min-width:128px;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;transition:background .4s}
.tile.bad::before{background:var(--bad)}.tile.good::before{background:var(--good)}.tile.warn::before{background:var(--warn)}
.tile .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.tile .v{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:2px;transition:color .4s;white-space:nowrap}
.tile.bad .v{color:var(--bad)}.tile.good .v{color:var(--good)}.tile.warn .v{color:var(--warn)}
.canvas{position:relative;background:var(--stage)}
.canvas svg{display:block;width:100%;height:auto}
.note{position:absolute;right:16px;top:14px;width:300px;background:var(--chip);border:2px solid var(--ink);border-radius:10px;padding:10px 14px;font-size:13.5px;box-shadow:3px 3px 0 var(--ink);transition:opacity .35s,transform .35s}
.note.left{right:auto;left:16px}
.note.hide{opacity:0;transform:translateY(-6px);pointer-events:none}
.note h4{margin:0 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--mut);font-weight:500;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:6px}
.note .r{display:flex;gap:10px;padding:2px 0;line-height:1.45}
.note .r b{min-width:62px;font-weight:600}
.note .hi{background:var(--acc);border-radius:4px;padding:2px 6px;margin:4px -6px 0;font-weight:600}
.note .ft{color:var(--mut);font-size:12px;margin-top:4px}
.stage-foot{display:flex;align-items:center;gap:16px;padding:10px 14px 12px;border-top:1px solid var(--line)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);margin-right:6px;vertical-align:-1px}
.legend i.sq{border-radius:2px}
.legend i.ring{background:transparent!important;border-width:2.5px}
.ctrls{margin-left:auto;display:flex;gap:8px}
.ibtn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--ink);background:var(--chip);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.ibtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.ibtn svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 步驟條 */
.steps{margin-top:14px;padding:14px 18px 16px}
.steps-h{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.steps-h b{color:var(--ink);font-weight:600}
.rail{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:14px}
.rail .bar{position:absolute;left:0;right:0;top:15px;height:2px;background:var(--line)}
.rail .bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .45s cubic-bezier(.2,.7,.2,1)}
.st{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.st .n{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:var(--chip);font-family:var(--mono);font-size:13px;font-weight:600;display:grid;place-items:center;transition:background .3s,transform .2s}
.st.done .n{background:#e8eedf}
.st.cur .n{background:var(--acc);transform:scale(1.12);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 45%,transparent)}
.st .l{font-size:12.5px;color:var(--mut);text-align:center;line-height:1.3;max-width:96px}
.st.cur .l{color:var(--ink);font-weight:700}
.st:hover .n{transform:scale(1.08)}

/* 這一步的說明 */
.lesson{margin-top:14px;padding:20px 24px 22px;display:grid;grid-template-columns:1fr auto;gap:6px 24px}
.lesson .tag{grid-column:2;grid-row:1;align-self:start;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;border:1.5px solid var(--ink);border-radius:999px;padding:3px 10px;background:#f6e7b8}
.lesson .stepno{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--mut);grid-column:1}
.lesson h2{grid-column:1/-1;margin:2px 0 4px;font-size:26px;font-weight:700}
.lesson .body{grid-column:1/-1;font-size:16.5px;line-height:1.85;max-width:62em}
.lesson .body p{margin:0 0 8px}
.lesson .body b{background:linear-gradient(transparent 62%,var(--acc) 62%)}
.meta{grid-column:1/-1;display:flex;gap:22px;flex-wrap:wrap;margin-top:8px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px}
.meta .mk{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--mut);margin-right:8px;text-transform:uppercase}
.meta .who span{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:1px 9px;margin-right:6px;font-size:13px;background:var(--chip)}
.meta .where code{font-family:inherit;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:2px 8px}

/* 底部 上一步／下一步 */
.bar-bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;gap:12px}
.btn{height:50px;border-radius:12px;border:2px solid var(--ink);background:var(--chip);padding:0 22px;font-weight:600;font-size:16px;display:flex;align-items:center;gap:10px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s,opacity .2s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn[disabled]{opacity:.38;cursor:default;box-shadow:none}
.btn.next{flex:1;background:var(--acc);color:var(--acc-ink);justify-content:space-between}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* SVG 裡的東西 */
.node{transition:opacity .45s ease}
.node.off{opacity:0;pointer-events:none}
.node.dim{opacity:.26}
.node .face{transition:fill .45s ease}
.link{transition:opacity .45s ease}
.link.off{opacity:0}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.7);opacity:0}}
.down-x{transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.35}*{transition-duration:.01ms!important}}
:fullscreen.stage{background:var(--stage);display:flex;flex-direction:column;justify-content:center}
</style>
<style>
/* ============================================================
   架構總覽的外觀（覆寫上面那份互動課樣式）
   色票跟 00–07 同一套 archify editorial 淺色（照 07-打卡一條線.html 檔頭）；選中的一步用朱紅
   顏色只給狀態：綠＝料、琥珀＝缺。只有淺色（引擎的方塊顏色是程式算的，深色還沒做）
   頁首那條「威琳 系統教學」藏起來：外面總覽已經有標題和「給誰看、最後對過系統」
   ============================================================ */
:root{
  --bg:#f2eee5; --card:#fbf8f1; --stage:#f7f3ea; --ink:#242018; --mut:#6f6658; --line:#d8d0c2; --grid:#e6dfd1;
  --acc:#242018; --acc-ink:#fbf8f1; --acc-lt:#ebe5d8; --chip:#fbf8f1;
  --good:#1f8a4c; --bad:#bb4c23; --warn:#b25e09; --ring:#bb4c23;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Heiti TC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"PingFang TC",monospace;
  --radius:14px;
}
:root{color-scheme:light}
.top{display:none}
.brand{font-size:17px;font-weight:600;letter-spacing:.04em;gap:10px}
.brand-sub{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.18em;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.crumb,.steps-h,.tile .k,.note h4,.lesson .stepno,.meta .mk{font-size:10.5px;font-weight:500;letter-spacing:.18em}
h1{font-size:30px;font-weight:600;letter-spacing:0}
.sub{font-size:15px}
.chip{border:1px solid var(--line);font-size:12px;background:var(--card)}
.chip.c1,.chip.c2,.chip.c3{background:var(--card)}
.card{border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tile{border:1px solid var(--line)}
.tile .v{font-family:var(--font);font-weight:300;font-size:22px;letter-spacing:-.01em}
.note{border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.08);width:270px;font-size:13px}
.note .hi{background:var(--acc-lt)}
.note .r b{min-width:86px;font-weight:600}
.ibtn{border:1px solid var(--line);box-shadow:none;border-radius:999px}
.ibtn:active{transform:scale(.96);box-shadow:none}
.st .n{border:1px solid var(--line);font-family:var(--font);font-weight:500}
.st.done .n{background:var(--acc-lt);border-color:var(--acc-lt)}
.st.cur .n{background:var(--ring);color:#fff;border-color:var(--ring);box-shadow:0 0 0 5px var(--acc-lt)}
.lesson .tag{border:1px solid var(--line);background:var(--card);font-size:10.5px;letter-spacing:.18em}
.lesson h2{font-size:22px;font-weight:600}
.lesson .body{font-size:15.5px;line-height:1.8}
.lesson .body b{background:none;font-weight:600}
.meta .who span{border:1px solid var(--line);font-size:12.5px}
.meta .where code{border:1px solid var(--line);background:var(--bg)}
.btn{border:1px solid var(--line);box-shadow:none;font-size:15px;height:48px}
.btn:active{transform:scale(.99);box-shadow:none}
.btn.next{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand">威琳<span class="brand-sub">系統教學</span></div>
  <div class="sp"></div>
  <div class="by" id="by"></div>
</div></header>

<main class="wrap">
  <section class="head">
    <div class="crumb" id="crumb"></div>
    <div class="title-row"><h1 id="h1"></h1><div class="chips" id="chips"></div></div>
    <p class="sub" id="sub"></p>
  </section>

  <section class="card stage" id="stage">
    <div class="tiles" id="tiles"></div>
    <div class="canvas"><svg id="svg" role="img"></svg><div class="note hide" id="note"></div></div>
    <div class="stage-foot">
      <div class="legend" id="legend"></div>
      <div class="ctrls">
        <button class="ibtn" id="bReplay" title="這一步重播" aria-label="這一步重播"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        <button class="ibtn" id="bPause" title="暫停／繼續（空白鍵）" aria-label="暫停或繼續"><svg viewBox="0 0 24 24" id="pIcon"><path d="M9 5v14M15 5v14"/></svg></button>
        <button class="ibtn" id="bFull" title="全螢幕" aria-label="全螢幕"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
      </div>
    </div>
  </section>

  <section class="card steps">
    <div class="steps-h"><span>這堂課</span><span id="stepCount"></span></div>
    <div class="rail" id="rail"><div class="bar"><i id="railFill"></i></div></div>
  </section>

  <section class="card lesson" id="lesson" aria-live="polite"></section>
</main>

<nav class="bar-bottom"><div class="bar-in">
  <button class="btn" id="bBack"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>上一步</button>
  <button class="btn next" id="bNext"><span id="nextLabel">下一步</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div></nav>

<script>
/* ============================================================
   課程內容（換一堂課只改這裡）
   - nodes：場景裡的東西。type＝prism（方塊）／tank（圓柱，可顯示存量）／crowd（一群人站在台子上）
     x、y 是等角格子座標（x 往右下、y 往左下），w、d、h 是寬、深、高（格子單位）
   - links：箭頭線。via＝'xy' 先走 x 再走 y、'yx' 反過來、'direct' 直線
   - kinds：流動小點的種類（顏色、形狀、圖例文字）
   - steps：每一步。沒列在 nodes 裡的東西會淡出；links 只畫列出的；flows 是這一步在跑的小點
   ============================================================ */
const LESSON = {
  by: "給第一次用系統的同事・內容照 2026-11-23 的系統",
  crumb: "系統教學 / 第一次用系統",
  title: "系統全景課",
  sub: "用一個假的案子「林宅」，從客戶走到收工，看系統每一塊在做什麼。",
  chips: [["c1","約 8 分鐘"],["c2","新進同事"],["c3","11 步"]],
  scale: 26, origin: [463, 275], viewBox: [1000, 430], notePos: "left",
  /* 方塊一律紙色底黑線；顏色只留給「狀態」：綠＝料、琥珀＝缺、紅＝出事 */
  palette: { white:"#fbf8f1", red:"#f6e3d8", green:"#e4f0e2", down:"#e4ddd0" },
  platform: ["#fbf8f1", "#efe9dd", "#e4ddd0"],
  people: ["#ebe5d8", "#d8d0c2", "#e4ddd0"],
  headColor: "#fbf8f1",
  kinds: {
    data:   { color:"#242018", label:"一筆資料" },
    item:   { color:"#1f8a4c", label:"料（設備、耗材）" },
    warn:   { color:"#b25e09", shape:"sq", label:"缺料回報" },
    person: { color:"#242018", shape:"ring", label:"人" }
  },
  tiles: [
    { key:"wh",    label:"主倉・智能開關", icon:"box" },
    { key:"box",   label:"林宅案場箱", icon:"box" },
    { key:"done",  label:"已裝好", icon:"wrench" },
    { key:"short", label:"缺料回報", icon:"alert" },
    { key:"vo",    label:"增減單", icon:"doc" }
  ],
  /* 格子座標：案場在正中 (0,0)，其他東西往四個方向排開 */
  nodes: {
    S: { type:"prism", x:0,  y:0,   w:2.4, d:2.4, h:1.7, color:"white", icon:"home",      label:"案場・林宅" },
    C: { type:"prism", x:0,  y:6,   w:2.2, d:2.2, h:1.4, color:"white", icon:"user",      label:"客戶・林先生" },
    W: { type:"prism", x:-6, y:0,   w:2.2, d:2.2, h:1.4, color:"white", icon:"clipboard", label:"工作紀錄" },
    X: { type:"prism", x:-6, y:6,   w:2.2, d:2.2, h:1.4, color:"white", icon:"doc",       label:"增減單" },
    T: { type:"crowd", x:0,  y:-6,  w:3.2, d:2.4, rows:2, cols:3, tag:"技術人員", tagIcon:"users" },
    K: { type:"prism", x:-6, y:-6,  w:2.2, d:2.2, h:1.4, color:"white", icon:"phone",     label:"LINE 打卡" },
    Q: { type:"prism", x:0,  y:-12, w:2.2, d:2.2, h:1.4, color:"white", icon:"alert",     label:"缺料" },
    V: { type:"prism", x:6,  y:-12, w:2.2, d:2.2, h:1.4, color:"white", icon:"truck",     label:"廠商" },
    M: { type:"tank",  x:6,  y:-6,  r:1.15, h:1.7, color:"white", levelColor:"green", label:"主倉" },
    B: { type:"tank",  x:6,  y:0,   r:0.95, h:1.3, color:"white", levelColor:"green", label:"林宅案場箱" }
  },
  links: {
    cs: { from:"C", to:"S", via:"direct" },
    ws: { from:"W", to:"S", via:"direct" },

  n.paint = c => n.faces.forEach(([f, k]) => f.style.fill = shade(c, k));
  n.paint(base);
  // 圖示畫在頂面正中，名字寫在方塊正下方（最靠近看的人那個角的下面）
  const [cx, cy] = P(x, y, h);
  if (n.icon) svgIcon(g, n.icon, cx, cy, 22);
  const foot = P(x1, y1, 0);
  if (n.label) {
    const t = el("text", { x: foot[0], y: foot[1] + 20, "text-anchor": "middle", "font-size": 14, "font-weight": 700, fill: INK, "font-family": "var(--font)", "paint-order": "stroke", stroke: "var(--stage)", "stroke-width": 4 }, g);
    t.textContent = n.label;
  }
  n.top = P(x0, y0, h); n.foot = [foot[0], foot[1] + 22]; n.center = P(x, y, h / 2);
}

function drawTank(g, n) {
  const { x, y } = n, r = n.r || 1.2, h = n.h || 1.6, base = col(n.color || "purple");
  const rx = 1.2247 * r * S, ry = 0.7071 * r * S;
  const [bx, by] = P(x, y, 0), [tx, ty] = P(x, y, h);
  el("ellipse", { cx: bx + 5, cy: by + 4, rx, ry, fill: INK, opacity: .07 }, g);
  const body = el("path", { d: `M${bx - rx},${ty} L${bx - rx},${by} A${rx},${ry} 0 0 0 ${bx + rx},${by} L${bx + rx},${ty} Z`, stroke: INK, "stroke-width": 2, "stroke-linejoin": "round", class: "face" }, g);
  // 存量：從底部往上長的一段顏色，高度跟著每一步的 level 動
  const lvl = el("path", { fill: col(n.levelColor || "green"), stroke: INK, "stroke-width": 1.4, opacity: .95 }, g);
  const lidEdge = el("path", { fill: "none", stroke: INK, "stroke-width": 2 }, g);
  lidEdge.setAttribute("d", `M${bx - rx},${by} A${rx},${ry} 0 0 0 ${bx + rx},${by}`);
  const top = el("ellipse", { cx: tx, cy: ty, rx, ry, stroke: INK, "stroke-width": 2, class: "face" }, g);
  n.faces = [[body, .86], [top, 1]];
  n.paint = c => n.faces.forEach(([f, k]) => f.style.fill = shade(c, k));
  n.paint(base);
  n.level = 0;
  n.setLevel = v => {
    n.level = v;
    if (v <= 0.001) { lvl.setAttribute("d", ""); return; }
    const ly = by - v * h * S;
    lvl.setAttribute("d", `M${bx - rx},${ly} L${bx - rx},${by} A${rx},${ry} 0 0 0 ${bx + rx},${by} L${bx + rx},${ly} A${rx},${ry} 0 0 1 ${bx - rx},${ly} Z`);
  };
  if (n.icon) svgIcon(g, n.icon, tx, ty, 18);
  // 名字寫在圓柱正下方，跟方塊一樣
  if (n.label) {
    const t = el("text", { x: bx, y: by + ry + 20, "text-anchor": "middle", "font-size": 14, "font-weight": 700, fill: INK, "font-family": "var(--font)", "paint-order": "stroke", stroke: "var(--stage)", "stroke-width": 4 }, g);
    t.textContent = n.label;
  }
  n.top = [bx - rx * .6, ty - ry]; n.foot = [bx, by + ry + 22]; n.center = [bx, (by + ty) / 2];
}

function drawCrowd(g, n) {
  const { x, y } = n, w = n.w || 4.5, d = n.d || 3.5, h = .35;
  const x0 = x - w / 2, x1 = x + w / 2, y0 = y - d / 2, y1 = y + d / 2;
  const a = { stroke: INK, "stroke-width": 2, "stroke-linejoin": "round" };
  const [pTop, pL, pR] = L.platform || ["#f7f3ea", "#e9e3d6", "#ddd6c7"];
  el("polygon", { ...a, fill: pL, points: pts([P(x0, y1, h), P(x1, y1, h), P(x1, y1, 0), P(x0, y1, 0)]) }, g);
  el("polygon", { ...a, fill: pR, points: pts([P(x1, y0, h), P(x1, y1, h), P(x1, y1, 0), P(x1, y0, 0)]) }, g);
  el("polygon", { ...a, fill: pTop, points: pts([P(x0, y0, h), P(x1, y0, h), P(x1, y1, h), P(x0, y1, h)]) }, g);
  // 小人：照遠到近畫，近的蓋住遠的
  const rows = n.rows || 3, cols = n.cols || 4, list = [];
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++)
    list.push([x0 + (j + .5) * w / cols, y0 + (i + .5) * d / rows, i * cols + j]);
  list.sort((p, q) => (p[0] + p[1]) - (q[0] + q[1]));
  list.forEach(([px, py, k]) => {
    const [sx, sy] = P(px, py, h);
    const c = L.people[k % L.people.length];
    el("rect", { x: sx - 5.5, y: sy - 17, width: 11, height: 15, rx: 5, fill: c, stroke: INK, "stroke-width": 1.6 }, g);
    el("circle", { cx: sx, cy: sy - 22, r: 5, fill: L.headColor || "#fffaf0", stroke: INK, "stroke-width": 1.6 }, g);
  });
  n.top = P(x0, y0, h); n.foot = P(x1, y1, 0); n.center = P(x, y, h);
  n.paint = () => {};
}

/* 小膠囊（節點底下的名字牌、線上的標籤）
   寬度用字數估，不用 getComputedTextLength：網路字型還沒載完時量到的寬度會偏小，字會跑出框 */
const textW = (t, fs) => [...t].reduce((w, c) => w + (/[\u2E80-\uFFFF]/.test(c) ? fs * 1.02 : fs * .62), 0);
function pill(parent, cx, cy, text, opt = {}) {
  const g = el("g", {}, parent), fs = 12.5, pad = 11, iw = opt.icon ? 18 : 0;
  const w = pad * 2 + iw + textW(text, fs), x = cx - w / 2;
  el("rect", { x, y: cy - 12, width: w, height: 24, rx: 12, fill: "var(--chip)", stroke: INK, "stroke-width": 1.8 }, g);
  if (opt.icon) svgIcon(g, opt.icon, x + pad + 6, cy, 13);
  const t = el("text", { x: x + pad + iw, y: cy + 4.5, "font-size": fs, "font-weight": 600, fill: INK, "font-family": "var(--mono)" }, g);
  t.textContent = text;
  return g;
}

for (const id in L.nodes) {
  const n = L.nodes[id]; n.id = id;
  const g = el("g", { class: "node off", "data-id": id }, gNodes);
  n.g = g;
  // 「現在看這裡」的擴散圈，畫在最底
  const [fx, fy] = P(n.x, n.y, 0), rr = nodeRadius(n);
  n.ring = el("ellipse", { cx: fx, cy: fy, rx: 1.2247 * rr * S, ry: .7071 * rr * S, fill: "none", stroke: "var(--ring)", "stroke-width": 2.5, class: "pulse", style: "display:none" }, g);
  if (n.type === "prism") drawPrism(g, n);
  else if (n.type === "tank") drawTank(g, n);
  else drawCrowd(g, n);
  if (n.tag) pill(g, n.center[0], n.foot[1] + 24, n.tag, { icon: n.tagIcon });
  // 壞掉的大叉
  n.downX = el("g", { class: "down-x", opacity: 0 }, g);
  el("circle", { cx: n.center[0], cy: n.center[1] - 4, r: 15, fill: "var(--bad)", stroke: INK, "stroke-width": 2 }, n.downX);
  el("path", { d: `M${n.center[0] - 6},${n.center[1] - 10}l12,12M${n.center[0] + 6},${n.center[1] - 10}l-12,12`, stroke: "#fff", "stroke-width": 3, "stroke-linecap": "round" }, n.downX);
  // 頭上的負載條（每一步可以不同）
  n.gauge = el("g", { opacity: 0, style: "transition:opacity .4s" }, gTop);
  n.depth = n.x + n.y;
}
// 遠的先畫：x+y 小的在後面
[...gNodes.children].sort((a, b) => L.nodes[a.dataset.id].depth - L.nodes[b.dataset.id].depth).forEach(c => gNodes.appendChild(c));

function setGauge(n, pct, tone, label) {
  n.gauge.innerHTML = "";
  if (pct == null) { n.gauge.setAttribute("opacity", 0); return; }
  const [tx, ty] = n.top, cx = tx + 6, cy = ty - 22, w = 96;
  const bad = pct >= 80, c = tone || (bad ? "var(--bad)" : pct >= 60 ? "var(--warn)" : "var(--good)");
  el("rect", { x: cx - w / 2, y: cy - 12, width: w, height: 24, rx: 12, fill: "var(--chip)", stroke: INK, "stroke-width": 1.8 }, n.gauge);
  el("rect", { x: cx - w / 2 + 10, y: cy - 3.5, width: 40, height: 7, rx: 3.5, fill: "var(--grid)" }, n.gauge);
  el("rect", { x: cx - w / 2 + 10, y: cy - 3.5, width: Math.max(3, 40 * pct / 100), height: 7, rx: 3.5, fill: c }, n.gauge);
  const t = el("text", { x: cx + w / 2 - 10, y: cy + 4.5, "text-anchor": "end", "font-size": 12.5, "font-weight": 600, fill: INK, "font-family": "var(--mono)" }, n.gauge);
  t.textContent = label ?? (pct + "%");
  n.gauge.setAttribute("opacity", 1);
}

/* ---------- 箭頭線 ---------- */
const LK = {};
function route(a, b, via) {
  const A = [a.x, a.y], B = [b.x, b.y];
  if (via === "direct") return [A, B];
  return via === "yx" ? [A, [a.x, b.y], B] : [A, [b.x, a.y], B];
}
/* 把頭尾縮進去，箭頭才不會被方塊蓋住 */
function trim(path, s, e) {
  const p = path.map(q => q.slice());
  const cut = (i, j, amt) => {
    const dx = p[j][0] - p[i][0], dy = p[j][1] - p[i][1], len = Math.hypot(dx, dy) || 1;
    const k = Math.min(amt, len - .05) / len;
    p[i][0] += dx * k; p[i][1] += dy * k;
  };
  cut(0, 1, s);
  const n = p.length - 1;
  cut(n, n - 1, e);
  return p.filter((q, i) => i === 0 || i === p.length - 1 || Math.hypot(q[0] - p[i - 1][0], q[1] - p[i - 1][1]) > .01);
}
for (const id in L.links) {
  const k = L.links[id], a = L.nodes[k.from], b = L.nodes[k.to];
  const rt = route(a, b, k.via);
  // 從後面接近的線（往畫面下方走）會被目標方塊本身擋住，箭頭看不到 → 終點多縮一段，縮多少跟方塊高度成正比
  const [p1, p2] = rt.slice(-2), dl = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) || 1;
  const behind = Math.max(0, (p2[0] - p1[0] + p2[1] - p1[1]) / dl / Math.SQRT2);
  const gp = trim(rt, nodeRadius(a), nodeRadius(b) + .15 + behind * (b.type === "crowd" ? 1 : (b.h || 1.6)) * .6);
  const sp = gp.map(([x, y]) => P(x, y, .1));
  const d = "M" + sp.map(q => q.map(v => v.toFixed(1)).join(",")).join("L");
  const g = el("g", { class: "link off" }, gLinks);
  const path = el("path", { d, fill: "none", stroke: INK, "stroke-width": 1.8, "stroke-linejoin": "round", "marker-end": "url(#arr)" }, g);
  if (k.bi) path.setAttribute("marker-start", "url(#arr)");
  if (k.dashed) path.setAttribute("stroke-dasharray", "5 5");
  k.g = g; k.path = path; k.len = path.getTotalLength();
  if (k.label) { const m = path.getPointAtLength(k.len / 2); pill(g, m.x, m.y - 2, k.label, { icon: k.labelIcon }); }
  LK[id] = k;
}

/* ---------- 流動的小點 ---------- */
let dots = [], flows = [], paused = false, last = performance.now(), clock = 0;
function spawn(f) {
  const k = LK[f.link], kind = L.kinds[f.kind] || {};
  if (!k) return;
  let e;
  if (kind.shape === "sq") e = el("rect", { width: 11, height: 11, x: -5.5, y: -5.5, rx: 2, fill: kind.color, stroke: INK, "stroke-width": 1.5 }, gDots);
  else if (kind.shape === "ring") e = el("circle", { r: 6, fill: "var(--stage)", stroke: kind.color, "stroke-width": 2.6 }, gDots);
  else e = el("circle", { r: 5.5, fill: kind.color, stroke: INK, "stroke-width": 1.5 }, gDots);
  dots.push({ e, k, p: 0, speed: f.speed || 170, rev: !!f.rev, failAt: f.failAt ?? (kind.x ? .85 : null), dead: 0 });
}
function crossAt(d) {
  // 失敗的請求：停在半路，變成紅色叉叉再消失
  d.e.remove();
  const pt = d.k.path.getPointAtLength(d.k.len * d.p);
  const g = el("g", { transform: `translate(${pt.x},${pt.y})` }, gDots);
  el("circle", { r: 8, fill: "var(--bad)", stroke: INK, "stroke-width": 1.5 }, g);
  el("path", { d: "M-3.5,-3.5L3.5,3.5M3.5,-3.5L-3.5,3.5", stroke: "#fff", "stroke-width": 2.2, "stroke-linecap": "round" }, g);
  d.e = g; d.dead = 1;
}
function tick(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!paused && !reduced) {
    clock += dt * 1000;
    flows.forEach(f => {
      if (clock - (f.delay || 0) >= f.next) { spawn(f); f.next += f.every; }
    });
    dots = dots.filter(d => {
      if (d.dead) { d.dead += dt; if (d.dead > .7) { d.e.remove(); return false; } d.e.setAttribute("opacity", 1.7 - d.dead); return true; }
      d.p += d.speed * dt / d.k.len;
      if (d.failAt != null && d.p >= d.failAt) { crossAt(d); return true; }
      if (d.p >= 1) { d.e.remove(); return false; }
      const pt = d.k.path.getPointAtLength(d.k.len * (d.rev ? 1 - d.p : d.p));
      d.e.setAttribute("transform", `translate(${pt.x},${pt.y})`);
      return true;
    });
  }
  // 存量動畫
  for (const id in L.nodes) {
    const n = L.nodes[id];
    if (n.setLevel && n.goal != null && Math.abs(n.level - n.goal) > .002) n.setLevel(n.level + (n.goal - n.level) * Math.min(1, dt * 5));
  }
  requestAnimationFrame(tick);
}
function setFlows(list) {
  dots.forEach(d => d.e.remove()); dots = [];
  clock = 0;
  flows = (list || []).map(f => ({ ...f, next: 0 }));
  if (reduced) flows.forEach(f => {   // 減少動態：每條線放一顆不動的點
    spawn(f); const d = dots[dots.length - 1]; if (!d) return;
    const pt = d.k.path.getPointAtLength(d.k.len * .5); d.e.setAttribute("transform", `translate(${pt.x},${pt.y})`);
  });
}

/* ---------- 數字卡：數字會從上一步跳到這一步 ---------- */
const num = s => { const m = String(s).match(/^([\d,]*\.?\d+)(.*)$/); return m ? { v: parseFloat(m[1].replace(/,/g, "")), dec: (m[1].split(".")[1] || "").length, comma: m[1].includes(","), unit: m[2] } : null; };
const fmt = (v, o) => { let s = v.toFixed(o.dec); if (o.comma) s = Number(s).toLocaleString("en-US", { minimumFractionDigits: o.dec, maximumFractionDigits: o.dec }); return s + o.unit; };
let tileTimer;
function setTiles(vals, from) {
  cancelAnimationFrame(tileTimer);
  const jobs = L.tiles.map(t => {
    const box = $("t-" + t.key), vEl = box.querySelector(".v");
    const [to, tone] = (vals && vals[t.key]) || ["–"];
    box.className = "tile " + (tone || "");
    const startText = from && from[t.key] ? from[t.key][0] : vEl.textContent;
    const a = num(startText), b = num(to);
    if (a && b && a.unit === b.unit && !reduced) return { vEl, a, b };
    vEl.textContent = to; return null;
  }).filter(Boolean);
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 650), e = 1 - Math.pow(1 - k, 3);
    jobs.forEach(j => j.vEl.textContent = fmt(j.a.v + (j.b.v - j.a.v) * e, j.b));
    if (k < 1) tileTimer = requestAnimationFrame(step);
  };
  if (jobs.length) tileTimer = requestAnimationFrame(step);
}

/* ---------- 步驟條 ---------- */
const rail = $("rail");
L.steps.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "st"; b.type = "button";
  b.innerHTML = `<span class="n">${i + 1}</span><span class="l">${s.label}</span>`;
  b.setAttribute("aria-label", `第 ${i + 1} 步：${s.label}`);
  b.onclick = () => go(i);
  rail.appendChild(b);
});

/* ---------- 切到某一步 ---------- */
let cur = -1;
function go(i, replay) {
  i = Math.max(0, Math.min(L.steps.length - 1, i));
  const s = L.steps[i], prev = replay ? L.steps[i - 1] : (cur >= 0 ? L.steps[cur] : null);
  cur = i;
  if (location.hash !== "#" + (i + 1)) history.replaceState(null, "", "#" + (i + 1));

  for (const id in L.nodes) {
    const n = L.nodes[id];
    let v = s.nodes[id]; if (typeof v === "string") v = { state: v };
    const st = v ? (v.state || "on") : "off";
    n.g.setAttribute("class", "node " + (st === "dim" ? "dim" : st === "off" ? "off" : ""));
    n.paint(st === "hot" ? col("red") : st === "down" ? (L.palette.down || "#d9d4ca") : col(v && v.color || n.color || "gray"));
    n.ring.style.display = st === "focus" && !reduced ? "" : "none";
    n.downX.setAttribute("opacity", st === "down" ? 1 : 0);
    setGauge(n, v ? v.gauge : null, v && v.gaugeTone, v && v.gaugeLabel);
    if (n.setLevel) { n.goal = v && v.level != null ? v.level : n.goal ?? 0; if (reduced) n.setLevel(n.goal); }
  }
  for (const id in LK) LK[id].g.setAttribute("class", "link " + (s.links.includes(id) ? "" : "off"));
  setFlows(s.flows);
  setTiles(s.tiles, prev && prev.tiles);

  const note = $("note");
  if (s.note) {
    note.innerHTML = `<h4>${s.note.title}</h4>` + (s.note.rows || []).map(([a, b]) => `<div class="r"><b>${a}</b><span>${b}</span></div>`).join("") +
      (s.note.hi ? `<div class="hi">${s.note.hi}</div>` : "") + (s.note.ft ? `<div class="ft">${s.note.ft}</div>` : "");
    note.classList.remove("hide");
  } else note.classList.add("hide");

  [...rail.querySelectorAll(".st")].forEach((b, j) => b.className = "st" + (j < i ? " done" : j === i ? " cur" : ""));
  $("railFill").style.width = (i / (L.steps.length - 1) * (100 - 100 / L.steps.length) + 50 / L.steps.length) + "%";
  $("railFill").parentElement.style.left = (50 / L.steps.length) + "%";
  $("railFill").parentElement.style.right = (50 / L.steps.length) + "%";
  $("railFill").style.width = (i / (L.steps.length - 1) * 100) + "%";
  $("stepCount").innerHTML = `第 <b>${i + 1}</b> 步，共 ${L.steps.length} 步`;

  const meta = (s.who || s.where) ? `<div class="meta">${s.who ? `<div class="who"><span class="mk">誰會做</span>${s.who.map(w => `<span>${w}</span>`).join("")}</div>` : ""}${s.where ? `<div class="where"><span class="mk">在哪裡</span><code>${s.where}</code></div>` : ""}</div>` : "";
  $("lesson").innerHTML = `<div class="stepno">STEP ${i + 1} / ${L.steps.length}</div><span class="tag">${s.tag || ""}</span><h2>${s.title}</h2><div class="body">${s.body}</div>${meta}`;

  $("bBack").disabled = i === 0;
  $("nextLabel").textContent = i === L.steps.length - 1 ? "從頭再看一次" : "下一步：" + L.steps[i + 1].label;
}

$("bBack").onclick = () => go(cur - 1);
$("bNext").onclick = () => go(cur === L.steps.length - 1 ? 0 : cur + 1);
$("bReplay").onclick = () => go(cur, true);
$("bPause").onclick = () => {
  paused = !paused;
  $("pIcon").innerHTML = paused ? '<path d="M7 4l13 8-13 8z"/>' : '<path d="M9 5v14M15 5v14"/>';
};
$("bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : $("stage").requestFullscreen?.();
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (e.key === "ArrowRight") go(cur + 1);
  else if (e.key === "ArrowLeft") go(cur - 1);
  else if (e.key === " ") { e.preventDefault(); $("bPause").click(); }
});
addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1)); if (n && n - 1 !== cur) go(n - 1); });

go((parseInt(location.hash.slice(1)) || 1) - 1);
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
