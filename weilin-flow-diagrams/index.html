<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>威琳內部系統・架構總覽</title>
<style>
  /* 這頁只是外殼：上方一排分頁，下方整面 iframe 顯示選中的那張圖。
     九張圖本體各自獨立（00~07-*.html；00 有兩張），重新 deliver 任何一張，這頁不用改就會顯示新版。 */
  :root {
    /* 2026-10-26 改成 archify editorial（暖紙感），跟裡面每張圖同一套色；選中的分頁用它的朱紅 */
    --bg: #f2eee5;
    --bar: #fbf8f1;
    --line: #d8d0c2;
    --ink: #242018;
    --muted: #6f6658;
    --active: #bb4c23;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181611;
      --bar: #231f18;
      --line: #39342a;
      --ink: #f4eddf;
      --muted: #b9ae9b;
      --active: #dd6b3d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Noto Serif TC", "Songti TC", serif;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px 0;
  }
  .title-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 { font-size: 16px; margin: 0 0 8px; font-weight: 700; }
  .hint { font-size: 12px; color: var(--muted); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button {
    appearance: none;
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    padding: 8px 14px;
    cursor: pointer;
  }
  nav button.active {
    background: var(--bg);
    color: var(--active);
    font-weight: 700;
  }
  main { flex: 1; min-height: 0; }
  iframe {
    display: none;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
  }
  iframe.show { display: block; }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1>威琳內部系統・架構總覽</h1>
    <span class="hint">圖內按 / 可搜尋、點線可追整條路徑｜打卡已放上正式版，其他功能還沒有正式資料｜「功能」是系統有哪些功能、各做好了沒｜「進度」上面是做到哪一步、下面是每個功能做了幾成｜「部署架構」「案場一條線」「案件里程碑」「庫存一條線」畫的是 2026-09 定的目標，程式還沒照它改；只有「操作與資料庫」是現況｜「資料地圖」是系統裡各種紀錄怎麼串在一起，已經照它改進系統｜「打卡一條線」是員工從 LINE 打卡到老闆看出勤整條怎麼走，照現在的程式畫</span>
  </div>
  <nav id="tabs">
    <!-- 00 是進度（2026-10-02 加，取代 架構/系統架構圖.html），放第一個。
         同日把「建置進度」「功能完全度」兩個分頁合成這一頁；手寫頁，正本在檔內 STEPS／FUNCS，不經 rebuild.py
         「功能」（2026-10-03 加）跟「進度」是同一個檔，data-view 帶到網址 ?view=功能 換一種看法；
         燈號要從 FUNCS 算，所以不另開檔。publish.py 會把重複的 data-src 併成一個 -->
    <button data-src="00-進度.html" data-view="功能" class="active">功能</button>
    <button data-src="00-進度.html">進度</button>
    <button data-src="01-部署架構.html">部署架構</button>
    <button data-src="02-案件脊椎.html">案場一條線</button>
    <button data-src="03-操作與資料.html">操作與資料庫</button>
    <button data-src="04-案件狀態.html">案件里程碑</button>
    <button data-src="05-庫存一條線.html">庫存一條線</button>
    <!-- 07 打卡一條線（2026-10-26 加）：手寫頁、沒有 JSON，規則照 功能/05-打卡與工作紀錄/守則.md 和 schema.sql 的預設值 -->
    <button data-src="07-打卡一條線.html">打卡一條線</button>
    <!-- 06 資料地圖（2026-10-03 系統負責人回「加」）：手寫頁，正本在檔內 NODES／LINKS，npm run check 會拿它對 schema -->
    <button data-src="06-資料地圖.html">資料地圖</button>
  </nav>
</header>
<main id="panes"></main>
<script>
  // 分頁切換：點到哪張才載入哪張（懶載入），避免一開頁就抓四張大檔。
  const tabs = document.querySelectorAll('#tabs button');
  const panes = document.getElementById('panes');
  const frames = new Map();

  // 一顆按鈕＝檔名＋看法（「功能」「進度」是同一個檔，只差 ?view=）
  const keyOf = b => b.dataset.src + '|' + (b.dataset.view || '');
  // 2026-10-03 換新名字：舊名字記著「00-進度.html」，不換的話看過的人會跳過新加的「功能」
  const TAB_KEY = 'weilin-arch-tab-v2';

  function show(btn) {
    tabs.forEach(b => b.classList.toggle('active', b === btn));
    const key = keyOf(btn);
    if (!frames.has(key)) {
      const f = document.createElement('iframe');
      // 網址後面帶一個當下時間，逼瀏覽器每次都重新抓檔、不用快取
      //（2026-09-25 系統負責人重建 04 後在 Arc 看到的還是舊圖，就是快取害的）
      f.src = encodeURI(btn.dataset.src) + '?v=' + Date.now() +
        (btn.dataset.view ? '&view=' + encodeURIComponent(btn.dataset.view) : '');
      f.title = btn.textContent;
      panes.appendChild(f);
      frames.set(key, f);
    }
    frames.forEach((f, k) => f.classList.toggle('show', k === key));
    try { localStorage.setItem(TAB_KEY, key); } catch (e) {}
  }

  tabs.forEach(b => b.addEventListener('click', () => show(b)));

  // 記住上次看的分頁；讀不到就開第一張
  let last = null;
  try { last = localStorage.getItem(TAB_KEY); } catch (e) {}
  const initial = [...tabs].find(b => keyOf(b) === last) || tabs[0];
  show(initial);
</script>
</body>
</html>
