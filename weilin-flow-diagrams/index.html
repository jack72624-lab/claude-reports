<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>威琳內部系統・架構總覽</title>
<style>
  /* 這頁只是外殼：上方一排分頁，下方整面 iframe 顯示選中的那張圖。
     九個分頁各自獨立（00~07-*.html；00 有兩種看法），重新 deliver 任何一張，這頁不用改就會顯示新版。 */
  :root {
    /* 2026-10-26 改成 archify editorial（暖紙感），跟裡面每張圖同一套色；選中的分頁用它的朱紅 */
    --bg: #f2eee5;
    --bar: #fbf8f1;
    --line: #d8d0c2;
    --ink: #242018;
    --muted: #6f6658;
    --active: #bb4c23;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181611;
      --bar: #231f18;
      --line: #39342a;
      --ink: #f4eddf;
      --muted: #b9ae9b;
      --active: #dd6b3d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Noto Serif TC", "Songti TC", serif;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px 0;
  }
  .title-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 { font-size: 16px; margin: 0 0 8px; font-weight: 700; }
  .hint { font-size: 12px; color: var(--muted); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav .sep { align-self: flex-end; font-size: 12px; color: var(--muted); padding: 0 4px 9px 14px; }
  nav button {
    appearance: none;
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    padding: 8px 14px;
    cursor: pointer;
  }
  nav button.active {
    background: var(--bg);
    color: var(--active);
    font-weight: 700;
  }
  main { flex: 1; min-height: 0; }
  iframe {
    display: none;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
  }
  iframe.show { display: block; }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1>威琳內部系統・架構總覽</h1>
    <!-- 目前分頁在講什麼、給誰看、最後對過系統是哪天：由下面 script 從按鈕的 data-about／data-for／data-checked 填，字只存在按鈕上 -->
    <span class="hint" id="about"></span>
  </div>
  <nav id="tabs">
    <!-- 分頁順序（2026-11-21 定）：老闆和公司同仁會看的放前面（功能、進度、四條流程、打卡），
         給做系統的人看的 01 部署架構、06 資料地圖放最後、前面隔一個小標。
         每顆按鈕三個屬性，頁頭那行從這裡讀：
           data-about   這頁在講什麼（白話一句）
           data-for     給誰看
           data-checked 最後拿這頁對過現在的系統是哪天（MM-DD）。改了哪頁、或對過哪頁，就改那顆的日期，規則在 架構/守則.md
         「功能」（2026-10-03 加）跟「進度」是同一個檔（00 手寫頁，正本在檔內 STEPS／FUNCS／GIST），
         data-view 帶到網址 ?view=功能 換一種看法。publish.py 會把重複的 data-src 併成一個 -->
    <button data-src="00-進度.html" data-view="功能" class="active"
      data-about="系統有哪些功能，每個做好了沒" data-for="老闆和公司同仁" data-checked="11-21">功能</button>
    <button data-src="00-進度.html"
      data-about="系統蓋到第幾步、每個功能做了幾成" data-for="老闆和公司同仁" data-checked="11-23">進度</button>
    <button data-src="02-案件脊椎.html"
      data-about="一個案場從接案、施工到結案怎麼走，還沒做的標「還沒做」" data-for="老闆和公司同仁" data-checked="11-21">案場一條線</button>
    <button data-src="03-操作與資料.html"
      data-about="按了哪顆鈕，資料寫進哪裡" data-for="老闆和公司同仁" data-checked="11-21">操作與資料庫</button>
    <button data-src="04-案件狀態.html"
      data-about="案件的里程碑一格一格怎麼打勾" data-for="老闆和公司同仁" data-checked="11-21">案件里程碑</button>
    <button data-src="05-庫存一條線.html"
      data-about="料從叫貨、入庫、出庫到盤點怎麼走" data-for="老闆和公司同仁" data-checked="11-21">庫存一條線</button>
    <!-- 07 打卡一條線（2026-10-26 加）：手寫頁、沒有 JSON，規則照 功能/05-打卡與工作紀錄/守則.md 和程式 -->
    <button data-src="07-打卡一條線.html"
      data-about="員工從 LINE 打卡，到老闆在出勤頁看到" data-for="老闆和公司同仁" data-checked="11-21">打卡一條線</button>
    <span class="sep" aria-hidden="true">給做系統的人看</span>
    <button data-src="01-部署架構.html"
      data-about="員工怎麼連進系統、資料存在哪、怎麼備份" data-for="做系統的人" data-checked="11-21">部署架構</button>
    <!-- 06 資料地圖（2026-10-03 加）：手寫頁，正本在檔內 NODES／LINKS，npm run check 會拿它對 schema -->
    <button data-src="06-資料地圖.html"
      data-about="系統裡各種紀錄怎麼串在一起" data-for="做系統的人" data-checked="11-21">資料地圖</button>
  </nav>
</header>
<main id="panes"></main>
<script>
  // 分頁切換：點到哪張才載入哪張（懶載入），避免一開頁就抓四張大檔。
  const tabs = document.querySelectorAll('#tabs button');
  const panes = document.getElementById('panes');
  const about = document.getElementById('about');
  const frames = new Map();

  // 一顆按鈕＝檔名＋看法（「功能」「進度」是同一個檔，只差 ?view=）
  const keyOf = b => b.dataset.src + '|' + (b.dataset.view || '');
  // 2026-10-03 換新名字：舊名字記著「00-進度.html」，不換的話看過的人會跳過新加的「功能」
  const TAB_KEY = 'weilin-arch-tab-v2';

  function show(btn) {
    tabs.forEach(b => b.classList.toggle('active', b === btn));
    const d = btn.dataset;
    const tip = /^0[1-5]-/.test(d.src) ? '｜圖內按 / 可搜尋、點線可追整條路徑' : '';
    about.textContent = `${d.about}｜給${d.for}看｜最後對過系統：${d.checked}${tip}`;
    const key = keyOf(btn);
    if (!frames.has(key)) {
      const f = document.createElement('iframe');
      // 網址後面帶一個當下時間，逼瀏覽器每次都重新抓檔、不用快取
      //（2026-09-25 系統負責人重建 04 後在 Arc 看到的還是舊圖，就是快取害的）
      f.src = encodeURI(btn.dataset.src) + '?v=' + Date.now() +
        (btn.dataset.view ? '&view=' + encodeURIComponent(btn.dataset.view) : '');
      f.title = btn.textContent;
      panes.appendChild(f);
      frames.set(key, f);
    }
    frames.forEach((f, k) => f.classList.toggle('show', k === key));
    try { localStorage.setItem(TAB_KEY, key); } catch (e) {}
  }

  tabs.forEach(b => b.addEventListener('click', () => show(b)));

  // 記住上次看的分頁；讀不到就開第一張
  let last = null;
  try { last = localStorage.getItem(TAB_KEY); } catch (e) {}
  const initial = [...tabs].find(b => keyOf(b) === last) || tabs[0];
  show(initial);
</script>
</body>
</html>
